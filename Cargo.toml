[package]
name = "molite-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
rusqlite = { version = "0.38", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "http2", "system-proxy"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
uuid = { version = "1", features = ["v7", "serde"] }
sha2 = "0.11"
hex = "0.4"
base64 = "0.22"
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["now", "serde"] }
toml = "1"
tar = { version = "0.4", default-features = false }
zstd = { version = "0.13", default-features = false }
walkdir = "2"
tempfile = "3"
aes-gcm = "0.11"
argon2 = "0.5"
rand = { version = "0.9", default-features = false, features = ["thread_rng"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
zeroize = "1"
semver = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[profile.release]
opt-level = "z"
lto = true
